server {
  listen 80;
  client_max_body_size 10m;
  root /usr/share/nginx/html;
  index index.html;

  # API requests go to the FastAPI container (service name "backend" in docker-compose).
  # On AWS with an ALB doing path routing (/api/* -> backend) this block is simply not used.
  # The variable + resolver make nginx look the host up per request, so the container still
  # starts on AWS where no host called "backend" exists (127.0.0.11 is Docker's internal DNS).
  resolver 127.0.0.11 valid=10s ipv6=off;
  location /api/ {
    set $backend_upstream http://backend:8000;
    proxy_pass $backend_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 60s;
  }

  location / {
    try_files $uri /index.html;
  }
}

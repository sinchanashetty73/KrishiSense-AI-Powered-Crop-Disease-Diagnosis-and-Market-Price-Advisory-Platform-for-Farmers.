<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#2f7d32" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>KrishiSense</title>
  </head>
  <body>
       <div class="farm-bg" id="farm-bg" aria-hidden="true"></div>
    <script>
      // Decoration only: 3D glass bubbles, rain and drifting leaves. Change the numbers to get more or less.
      (function () {
        var box = document.getElementById("farm-bg"), small = window.innerWidth < 700;
        function rnd(a, b) { return a + Math.random() * (b - a); }
        function add(cls, css, html) {
          var e = document.createElement("span"); e.className = cls; e.style.cssText = css;
          if (html) e.innerHTML = html; box.appendChild(e); return e;
        }
        // rain streaks falling
        for (var i = 0; i < (small ? 22 : 45); i++) {
          add("rain", "left:" + rnd(0, 100) + "%;height:" + rnd(26, 60) + "px;animation-duration:" + rnd(1.3, 2.6) +
              "s;animation-delay:" + (-rnd(0, 3)) + "s;opacity:" + rnd(.25, .6));
        }
        // glossy 3D bubbles rising (big ones are blurred and slow to look closer to the camera)
        for (i = 0; i < (small ? 10 : 18); i++) {
          var size = rnd(18, 110), tone = i % 3 === 0 ? "gold" : i % 3 === 1 ? "dew" : "leaf";
          add("bubble " + tone, "left:" + rnd(0, 96) + "%;width:" + size + "px;height:" + size + "px;animation-duration:" +
              rnd(22, 48) + "s;animation-delay:" + (-rnd(0, 40)) + "s;" + (size > 80 ? "filter:blur(1.5px);" : ""));
        }
        // leaves drifting down and fluttering in 3D
        var leaf = '<svg viewBox="0 0 64 64" width="100%" height="100%"><defs><linearGradient id="LG" x1="0" y1="0" x2="1" y2="1">' +
          '<stop offset="0" stop-color="#b6e07a"/><stop offset="1" stop-color="#2f8f3e"/></linearGradient></defs>' +
          '<path d="M32 4C50 14 58 34 32 60 6 34 14 14 32 4Z" fill="url(#LG)"/>' +
          '<path d="M32 10V58M32 26L22 18M32 36L42 28M32 46L21 38" stroke="rgba(255,255,255,.55)" stroke-width="1.6" fill="none"/></svg>';
        for (i = 0; i < (small ? 5 : 9); i++) {
          var l = rnd(22, 46);
          add("leaf-f", "left:" + rnd(0, 96) + "%;width:" + l + "px;height:" + l + "px;animation-duration:" + rnd(18, 34) +
              "s;animation-delay:" + (-rnd(0, 30)) + "s;", leaf);
        }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
